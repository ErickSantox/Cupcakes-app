spring.application.name=cupcakes-api

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cupcakes}
spring.datasource.username=${POSTGRES_USER:cupcakes}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
