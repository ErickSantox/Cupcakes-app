<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Conta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Conta</ion-title>
    </ion-toolbar>
  </ion-header>


    <section class="ion-padding">
    @if (sessao.logado()) {
      <h2>Olá, {{ sessao.usuario()?.nome }}!</h2>
      <p>{{ sessao.usuario()?.email }}</p>
            @if (sessao.usuario()?.perfil === 'ADMIN') {
        <ion-button expand="block" color="secondary" routerLink="/admin/produtos">Área do administrador</ion-button>
      }
      <ion-button expand="block" fill="outline" color="medium" (click)="sair()">Sair</ion-button>
    } @else {
      <p>Entre para fazer pedidos e acompanhar suas entregas.</p>
      <ion-button expand="block" routerLink="/login">Entrar</ion-button>
      <ion-button expand="block" fill="clear" routerLink="/cadastro">Criar conta</ion-button>
    }
  </section>
</ion-content>
