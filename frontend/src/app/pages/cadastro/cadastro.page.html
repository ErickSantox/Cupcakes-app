<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/conta"></ion-back-button>
    </ion-buttons>
    <ion-title>Criar conta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="cadastrar()">

    <ion-input class="ion-margin-bottom" label="Nome" labelPlacement="floating" fill="outline"
      formControlName="nome"
      [errorText]="erroDe('nome', 'Informe o nome (mín. 2 caracteres).')"></ion-input>

    <ion-input class="ion-margin-bottom" label="Sobrenome" labelPlacement="floating" fill="outline"
      formControlName="sobrenome"
      [errorText]="erroDe('sobrenome', 'Informe o sobrenome (mín. 2 caracteres).')"></ion-input>

    <ion-input class="ion-margin-bottom" label="Telefone (DDD + número)" labelPlacement="floating" fill="outline"
      type="tel" inputmode="numeric" formControlName="telefone"
      [errorText]="erroDe('telefone', 'Somente dígitos, com DDD. Ex.: 11999998888')"></ion-input>

    <ion-input class="ion-margin-bottom" label="E-mail" labelPlacement="floating" fill="outline"
      type="email" formControlName="email"
      [errorText]="erroDe('email', 'Informe um e-mail válido.')"></ion-input>

    <ion-input class="ion-margin-bottom" label="Senha" labelPlacement="floating" fill="outline"
      type="password" formControlName="senha"
      [errorText]="erroDe('senha', 'A senha deve ter entre 8 e 72 caracteres.')"></ion-input>

    <ion-button expand="block" type="submit" [disabled]="enviando()">
      @if (enviando()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Criar conta
      }
    </ion-button>

  </form>
</ion-content>
